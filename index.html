<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caçador de Monstros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="hud">
            <div class="hudSection">
                <span>Vida:</span>
                <div id="playerHealth" class="healthBar"></div>
            </div>
            <div class="hudSection">
                <span>Monstro:</span>
                <div id="monsterHealth" class="healthBar"></div>
            </div>
            <div class="hudSection">
                <span id="phaseDisplay">Fase: 1</span>
            </div>
            <div class="hudSection">
                <span>Cooldown Bar</span>
                <div id="cooldownBar" class="healthBar">
                    <div id="cooldownBarFill" style="width:0%"></div>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameInfo">
            <p id="instructions">Escolha sua arma | Use WASD ou Setas para mover | Clique ou Espaço para atacar</p>
            <div id="statsDisplay"></div>
        </div>
    </div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const el = document.createElement('div');
            el.id = 'debug-error';
            el.style.position = 'fixed';
            el.style.top = '0';
            el.style.left = '0';
            el.style.right = '0';
            el.style.background = 'rgba(255,0,0,0.95)';
            el.style.color = '#fff';
            el.style.padding = '8px';
            el.style.fontFamily = 'sans-serif';
            el.style.zIndex = '9999';
            el.textContent = message + ' @ ' + source + ':' + lineno + ':' + colno;
            document.body.appendChild(el);
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
